# 固件发布只允许人工选择产品后触发，普通 dev 推送不会生成生产 Release。
name: 发布设备固件
run-name: 发布 ${{ inputs.product }} 固件

on:
  workflow_dispatch:
    inputs:
      product:
        description: 要构建并发布的设备产品
        required: true
        type: choice
        options:
          - photopainter
          - deskmate

permissions:
  contents: write

concurrency:
  group: firmware-release-${{ inputs.product }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 准备 OTA 构建身份
        id: ota
        run: python build_tools/ci_ota.py prepare --product "${{ inputs.product }}"

      - name: 使用官方 ESP-IDF Docker 构建
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          path: ${{ steps.ota.outputs.project_dir }}
          esp_idf_version: v6.0.1
          target: esp32s3
          command: >-
            idf.py -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.ci" -B build build &&
            esptool.py image-info "build/${{ steps.ota.outputs.firmware_file }}" > build/image-info.txt

      - name: 生成并校验 OTA 清单
        id: assets
        run: >-
          python build_tools/ci_ota.py finalize
          --product "${{ inputs.product }}"
          --ota-version "${{ steps.ota.outputs.ota_version }}"

      - name: 发布到 DeskSuite Release
        uses: causebefore/esp-idf-firmware-action@796fc964cf8d3be37a50f62e72e819e99dd9fe22
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          firmware: ${{ steps.assets.outputs.firmware }}
          manifest: ${{ steps.assets.outputs.manifest }}
          target: ${{ github.sha }}
