[project]
name = "desksuite-hub"
version = "0.2.0"
description = "Shared device services and product backends for DeskSuite devices."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "websockets>=15.0",
    "loguru>=0.7.0",
    "caldav>=3.2.1",
    "feedparser>=6.0.12",
    "icalendar>=7.2.0",
    "imap-tools>=1.13.0",
    "pillow>=11.0.0",
    "playwright>=1.50.0",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langchain-mcp-adapters>=0.3.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "httpx2>=2.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
