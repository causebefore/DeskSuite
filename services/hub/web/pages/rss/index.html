<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=800, initial-scale=1">
  <title>PhotoPainter RSS</title>
  <!-- PHOTO_PAINTER_FRAMEWORK_STYLE -->
  <!-- PHOTO_PAINTER_STYLE -->
</head>
<body class="trmnl">
  <main class="screen screen--og screen--2bit screen--no-bleed">
    <div class="view view--full">
      <div class="layout rss-page">
        <section class="feed-panel" aria-label="RSS 文章列表">
          <header class="feed-header flex flex--row flex--between">
            <div>
              <div class="label label--small pp-cn-min">LATEST STORIES · 最新文章</div>
              <h1 class="title title--large font--bold pp-cn">今日阅读</h1>
            </div>
            <div class="header-meta">
              <span id="feed-status" class="label label--small label--outline pp-cn-min">RSS</span>
              <strong id="updated-text" class="value value--small value--tnums font--bold">--</strong>
            </div>
          </header>

          <div id="story-list" class="story-list list gap--none"></div>

          <footer class="feed-footer flex flex--row flex--between content content--small pp-cn-min">
            <span id="latest-text" class="footer-strong">最近文章 --</span>
            <span id="source-count">-- 个订阅源 · 每小时刷新</span>
          </footer>
        </section>
      </div>
    </div>
  </main>
  <!-- PHOTO_PAINTER_FRAMEWORK_SCRIPT -->
  <!-- PHOTO_PAINTER_SCRIPT -->
</body>
</html>
