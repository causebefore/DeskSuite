    override_path: ../../../components/communication/transport
  desksuite/protocols:
    version: "^0.1"
    override_path: ../../../components/communication/protocols
  desksuite/time_sync:
    version: "^0.1"
    override_path: ../../../components/communication/time_sync
  desksuite/firmware_ota:
    version: "^0.1"
    override_path: ../../../components/communication/tools/firmware_ota
  desksuite/remote_log:
    version: "^0.1"
    override_path: ../../../components/communication/tools/remote_log
  desksuite/web_console_service:
    version: "^0.1"
    override_path: ../../../components/services/web_console_service
  desksuite/web_console_network_provider:
