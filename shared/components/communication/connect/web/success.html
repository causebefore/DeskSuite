<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>设备正在连接</title>
    <style>
        body {
            margin: 0;
            color: #17202a;
            background: #f4f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        }

        .wrap {
            max-width: 520px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            margin-top: 32px;
            padding: 24px;
            background: #fff;
            border: 1px solid #dfe5ec;
            border-radius: 14px;
            box-shadow: 0 8px 28px #0001;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        p {
            margin: 8px 0;
            color: #5d6d7e;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <h1>配置已提交</h1>
            <p id="status">设备正在验证你选择的 Wi-Fi，验证完成前设备热点会保持开启。</p>
            <p><a href="/">连接失败时返回修改配置</a></p>
        </div>
    </div>
    <script>
        async function updateStatus() {
            try {
                const response = await fetch("/status");
                const result = await response.json();
                document.getElementById("status").textContent = result.message;
            } catch (error) {
                // Portal 可能在联网成功后关闭，此时保留最后一次状态。
            }
            setTimeout(updateStatus, 1000);
        }

        updateStatus();
    </script>
</body>
</html>
