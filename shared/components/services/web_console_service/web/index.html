<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>网页控制台</title>
  <!-- WEB_CONSOLE_STYLES -->
</head>
<body>
  <section class="console-card">
    <header class="console-header">
      <h1>网页控制台</h1>
      <p class="console-subtitle">设备本地管理界面</p>
    </header>
    <main class="console-main">
      <form id="loginView" class="login-view">
        <label for="accessCode">6 位访问码</label>
        <input id="accessCode" inputmode="numeric" autocomplete="one-time-code"
               maxlength="6" pattern="[0-9]{6}" required type="text">
        <button type="submit">登录</button>
        <p id="loginMessage" class="notice" role="alert"></p>
      </form>

      <section id="consoleView" class="hidden">
        <div class="console-toolbar">
          <nav id="moduleNavigation" class="module-navigation" aria-label="控制台功能"></nav>
          <button id="logoutButton" class="logout-button" type="button">退出登录</button>
        </div>
        <p id="consoleMessage" class="notice" role="alert"></p>
        <section id="emptyModuleView" class="empty-module hidden">
          当前固件未公开可用的控制台功能。
        </section>
        <div id="moduleHost">
          <!-- WEB_CONSOLE_MODULES -->
        </div>
      </section>
    </main>
  </section>
  <!-- WEB_CONSOLE_SCRIPTS -->
</body>
</html>
