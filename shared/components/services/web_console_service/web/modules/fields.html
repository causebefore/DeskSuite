<section id="settingsCenter" class="settings-center hidden" aria-labelledby="settingsCenterTitle">
  <section id="settingsHome" aria-labelledby="settingsCenterTitle">
    <header class="settings-center-header">
      <h2 id="settingsCenterTitle" class="module-title">设置</h2>
      <p id="settingsCenterDescription">管理设备公开的配置与信息。</p>
    </header>
    <div id="settingsSectionList" class="settings-section-list"></div>
    <p id="settingsHomeEmpty" class="empty-module hidden">当前设备未公开设置类别。</p>
  </section>

  <section id="settingsDetail" class="hidden" aria-labelledby="settingsDetailTitle">
    <header class="settings-detail-header">
      <button id="settingsBack" class="text-button" type="button">‹ 设置</button>
      <div>
        <h2 id="settingsDetailTitle" class="module-title"></h2>
        <p id="settingsDetailDescription"></p>
      </div>
    </header>
    <p id="settingsLiveMessage" class="notice" role="status" aria-live="polite"></p>
    <button id="pendingResultCheck" class="secondary hidden" type="button">继续查询原请求</button>

    <div id="settingsModuleHost"></div>
    <div id="statusModuleHost"></div>
    <div id="actionsModuleHost"></div>
  </section>
</section>
