<div id="settingsModule" data-web-console-module="settings">
  <section id="settingsFieldsRegion" class="detail-region hidden" aria-labelledby="settingsFieldsTitle">
    <h3 id="settingsFieldsTitle">配置项</h3>
    <form id="settingsForm">
      <div id="settingsFields" class="field-list"></div>
    </form>
  </section>
  <div id="settingsControls" class="sticky-save hidden">
    <p id="settingsChangeCount">尚无更改</p>
    <div>
      <button id="settingsUndo" class="secondary" type="button" disabled>撤销</button>
      <button id="settingsSave" type="submit" form="settingsForm" disabled>保存更改</button>
    </div>
  </div>
</div>
<div id="draftDialog" class="confirm-layer hidden" role="dialog" aria-modal="true"
     aria-labelledby="draftDialogTitle" aria-describedby="draftDialogDescription" tabindex="-1">
  <section class="confirm-dialog">
    <h2 id="draftDialogTitle">有尚未保存的更改</h2>
    <p id="draftDialogDescription">离开前要如何处理这些更改？</p>
    <div class="confirm-actions">
      <button id="draftSaveLeave" type="button">保存并离开</button>
      <button id="draftDiscardLeave" class="secondary" type="button">放弃更改</button>
      <button id="draftCancelLeave" class="text-button" type="button">取消</button>
    </div>
  </section>
</div>
