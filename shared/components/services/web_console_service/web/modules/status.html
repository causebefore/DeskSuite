<section id="statusView" class="management-section hidden" data-web-console-module="status">
  <h2 class="module-title">设备状态</h2>
  <div class="module-toolbar">
    <div class="section-selector">
      <label for="statusSection">状态分区</label>
      <select id="statusSection"></select>
    </div>
    <div class="section-actions">
      <button id="statusRefresh" class="secondary" type="button">刷新状态</button>
    </div>
  </div>
  <p id="statusMessage" class="notice" role="alert"></p>
  <p id="statusUpdatedAt" class="status-updated"></p>
  <div id="statusFields" class="field-list"></div>
</section>
